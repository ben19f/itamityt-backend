stages:
  - test
  - build-latest
  - build-tag

test-user-journey:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: itamityt_test
    POSTGRES_USER: itamityt
    POSTGRES_PASSWORD: ci_test_password
    DATABASE_URL: postgresql+asyncpg://itamityt:ci_test_password@postgres:5432/itamityt_test
    SECRET_KEY: ci-only-secret-key
    ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    # The test stubs storage operations, but settings still validates these fields.
    S3_ENDPOINT: http://localhost:9000
    S3_PUBLIC_URL: http://localhost:9000/itamityt-test
    S3_ACCESS_KEY: ci-test-access-key
    S3_SECRET_KEY: ci-test-secret-key
    S3_BUCKET: itamityt-test
    S3_REGION: us-east-1
    S3_PREFIX: ci-test
    # Settings validates SMTP config during app import; the test stubs email delivery.
    SMTP_HOST: localhost
    SMTP_PORT: "465"
    SMTP_USERNAME: ci-test
    SMTP_PASSWORD: ci-test
    SMTP_FROM: ci-test@example.com
    PUBLIC_API_URL: http://localhost:8100
  script:
    - pip install --no-cache-dir -r requirements.txt
    - alembic upgrade head
    - pytest -q tests/test_user_journey.py
  tags:
    - docker

build-test-image:
  stage: build-latest
  image: docker:24-cli
  needs:
    - test-user-journey

  tags:
    - docker


  script:
    - IMAGE=192.168.96.116:5000/itamityt/backend
    - docker version
    - docker build -t $IMAGE:latest .
    - docker push $IMAGE:latest
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /build(\r?\n)?$/'

build-tag-image:
  stage: build-tag
  image: docker:24-cli
  needs:
    - test-user-journey

  tags:
    - docker


  script:
    - IMAGE=192.168.96.116:5000/itamityt/backend
    - docker version
    - docker build -t $IMAGE:$CI_COMMIT_TAG .
    - docker push $IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG








