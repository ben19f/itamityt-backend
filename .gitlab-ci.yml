stages:
  - test
  - build-latest
  - build-tag

test-user-journey:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PUBLIC_API_URL: http://localhost:8100
  script:
    - pip install --no-cache-dir -r requirements.txt
    - alembic upgrade head
    - pytest -q tests/test_user_journey.py
  tags:
    - docker

build-test-image:
  stage: build-latest
  image: docker:24-cli
  needs:
    - test-user-journey

  tags:
    - docker


  script:
    - IMAGE=192.168.96.116:5000/itamityt/backend
    - docker version
    - docker build -t $IMAGE:latest .
    - docker push $IMAGE:latest
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /build(\r?\n)?$/'

build-tag-image:
  stage: build-tag
  image: docker:24-cli
  needs:
    - test-user-journey

  tags:
    - docker


  script:
    - IMAGE=192.168.96.116:5000/itamityt/backend
    - docker version
    - docker build -t $IMAGE:$CI_COMMIT_TAG .
    - docker push $IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG








