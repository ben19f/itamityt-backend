stages:
  - build
  - update

build-image:
  stage: build
  image: docker:24-cli

  tags:
    - docker


  script:

    - IMAGE=192.168.96.116:5000/app/backend
    - docker version
    - echo "REG_USER=[$REG_USER]"
    - echo "REG_PASS=[$REG_PASS]"
    - echo "$REG_PASS" | docker login 192.168.96.116:5000 --username "$REG_USER" --password-stdin
    - docker build -t $IMAGE:$CI_COMMIT_TAG .
    - docker tag $IMAGE:$CI_COMMIT_TAG $IMAGE:latest
    - docker push $IMAGE:$CI_COMMIT_TAG
    - docker push $IMAGE:latest
  rules:
    - if: '$CI_COMMIT_TAG'

update-infra:
  stage: update
  image: alpine:latest

  script:
    - apk add --no-cache git yq

    - git clone https://gitlab.com/itamityt/itamityt-infra.git
    - cd itamityt-infra

    - git checkout forhelm

    - yq e '.backend.image = "192.168.96.116:5000/app/backend:'"$CI_COMMIT_TAG"'"' -i values-dev.yaml

    - git config user.email "ci@bot.com"
    - git config user.name "ci-bot"

    - git remote set-url origin https://oauth2:${INFRA_TOKEN}@gitlab.com/itamityt/itamityt-infra.git

    - git commit -am "update frontend image to $CI_COMMIT_TAG"
    - git push origin forhelm